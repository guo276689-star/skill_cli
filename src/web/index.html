<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Manager</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f1117;color:#e1e4e8;display:flex;height:100vh}
#sidebar{width:200px;background:#161b22;border-right:1px solid #30363d;padding:16px 0;display:flex;flex-direction:column;flex-shrink:0}
#sidebar .logo{padding:0 16px 20px;font-size:18px;font-weight:700;color:#58a6ff}
#sidebar .nav{padding:4px 8px;cursor:pointer;border-radius:6px;margin:2px 8px;font-size:13px;color:#8b949e;transition:.15s;user-select:none}
#sidebar .nav:hover{background:#1c2128;color:#c9d1d9}
#sidebar .nav.active{background:#1f6feb22;color:#58a6ff}
#main{flex:1;overflow-y:auto;padding:24px}
.panel{display:none}
.panel.active{display:block}
h2{font-size:20px;font-weight:600;margin-bottom:16px}
.search-bar{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.search-bar input,.search-bar select,.search-bar button{padding:8px 12px;border:1px solid #30363d;border-radius:6px;background:#0d1117;color:#c9d1d9;font-size:13px;outline:none}
.search-bar input:focus{border-color:#58a6ff}
.search-bar input{flex:1;min-width:200px}
.search-bar button{background:#238636;border-color:#238636;color:#fff;cursor:pointer;font-weight:600}
.search-bar button:hover{background:#2ea043}
.card{border:1px solid #30363d;border-radius:8px;padding:14px 16px;margin-bottom:10px;background:#161b22;transition:.15s}
.card:hover{border-color:#58a6ff}
.card .name{font-weight:600;color:#58a6ff;font-size:14px;margin-bottom:4px}
.card .desc{color:#8b949e;font-size:12px;margin-bottom:8px;line-height:1.5}
.card .meta{display:flex;gap:16px;font-size:11px;color:#484f58;flex-wrap:wrap}
.card .actions{margin-top:10px;display:flex;gap:6px}
.btn{padding:5px 12px;border-radius:6px;font-size:12px;cursor:pointer;border:1px solid #30363d;background:#21262d;color:#c9d1d9;transition:.15s}
.btn:hover{background:#30363d}
.btn.primary{background:#238636;border-color:#238636;color:#fff}
.btn.primary:hover{background:#2ea043}
.btn.danger{color:#f85149;border-color:#f8514966}
.btn.danger:hover{background:#f8514922}
.btn.warn{color:#d29922;border-color:#d2992266}
.score-bar{display:flex;align-items:center;gap:8px}
.score-bar .bar{flex:1;height:8px;background:#21262d;border-radius:4px;overflow:hidden}
.score-bar .bar div{height:100%;border-radius:4px;transition:.3s}
.score-bar .grade{font-weight:700;font-size:14px;width:24px;text-align:center}
.grade-a{color:#238636}.grade-b{color:#58a6ff}.grade-c{color:#d29922}.grade-d{color:#f85149}.grade-f{color:#f85149}
.env-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.env-item{padding:12px;background:#161b22;border:1px solid #30363d;border-radius:8px;display:flex;align-items:center;gap:10px}
.env-item .icon{font-size:18px}
.env-item .label{font-size:11px;color:#8b949e}
.env-item .val{font-size:13px;color:#c9d1d9}
.empty{text-align:center;padding:60px 20px;color:#484f58}
.empty .big{font-size:48px;margin-bottom:12px}
#loading{text-align:center;padding:40px;color:#8b949e}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:#00000088;z-index:100;justify-content:center;align-items:center}
.modal-overlay.show{display:flex}
.modal{background:#161b22;border:1px solid #30363d;border-radius:12px;padding:24px;max-width:700px;max-height:80vh;overflow-y:auto;width:90%}
.modal h3{margin-bottom:12px}
.modal pre{background:#0d1117;padding:12px;border-radius:8px;font-size:11px;line-height:1.6;overflow-x:auto;white-space:pre-wrap}
.diff-add{color:#3fb950}.diff-del{color:#f85149}.diff-mod{color:#d29922}.diff-same{color:#484f58}
</style>
</head>
<body>
<div id="sidebar">
  <div class="logo">🧩 Skills</div>
  <div class="nav active" data-panel="discover">🔍 发现</div>
  <div class="nav" data-panel="mine">📦 我的 Skills</div>
  <div class="nav" data-panel="quality">📊 质量中心</div>
  <div class="nav" data-panel="env">🖥️ 环境</div>
</div>
<div id="main">
  <div id="panel-discover" class="panel active">
    <h2>🔍 发现 Skills</h2>
    <div class="search-bar">
      <input id="search-input" placeholder="搜索 Skills，如 code review、react..." onkeydown="if(event.key==='Enter')doSearch()">
      <select id="search-stars"><option value="0">全部 ⭐</option><option value="100">≥100</option><option value="500">≥500</option><option value="1000">≥1K</option></select>
      <select id="search-time"><option value="">全部时间</option><option value="7d">7天</option><option value="30d">30天</option><option value="3m">3个月</option></select>
      <button onclick="doSearch()">搜索</button>
    </div>
    <div id="search-results"><div class="empty"><div class="big">🔍</div><p>搜索 GitHub 上的 AI Agent Skills</p></div></div>
  </div>
  <div id="panel-mine" class="panel"><h2>📦 我的 Skills</h2><div id="mine-list"></div></div>
  <div id="panel-quality" class="panel"><h2>📊 质量中心</h2><div id="quality-content"></div></div>
  <div id="panel-env" class="panel"><h2>🖥️ 环境诊断</h2><div id="env-content"></div></div>
</div>
<div id="diff-modal" class="modal-overlay" onclick="if(event.target===this)closeDiff()">
  <div class="modal"><h3 id="diff-title"></h3><pre id="diff-body"></pre>
    <div style="margin-top:12px;display:flex;gap:8px;justify-content:flex-end">
      <button class="btn" onclick="closeDiff()">关闭</button>
      <button class="btn primary" id="diff-update-btn" onclick="doUpdateFromDiff()">确认更新</button>
    </div>
  </div>
</div>
<script>
let curSkill=null;
const API=(p,o)=>fetch('/api/'+p+(o?'?'+new URLSearchParams(o):'')).then(r=>r.json());

document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>{
  document.querySelectorAll('.nav').forEach(x=>x.classList.remove('active'));
  n.classList.add('active');
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  const el=document.getElementById('panel-'+n.dataset.panel);
  el.classList.add('active');
  if(n.dataset.panel==='mine')loadMine();
  if(n.dataset.panel==='quality')loadQuality();
  if(n.dataset.panel==='env')loadEnv();
}));

async function doSearch(){
  const kw=document.getElementById('search-input').value.trim();
  if(!kw)return;
  const r=document.getElementById('search-results');
  r.innerHTML='<div id="loading">搜索中...</div>';
  const stars=document.getElementById('search-stars').value;
  const time=document.getElementById('search-time').value;
  const res=await API('search',{q:kw,stars,time:time||undefined});
  if(!res.ok){r.innerHTML=`<div class="empty"><p>${res.error}</p></div>`;return;}
  if(!res.data.length){r.innerHTML='<div class="empty"><div class="big">🔍</div><p>未找到</p></div>';return;}
  r.innerHTML=res.data.map(r=>`<div class="card"><div class="name">${s(r.skillName)}</div><div class="desc">${s(r.skillDesc||r.repoDesc||'')}</div><div class="meta"><span>${s(r.repo)}</span><span>⭐ ${r.repoStars>=1000?(r.repoStars/1000).toFixed(1)+'K':r.repoStars}</span><span>${ta(r.updatedAt)}</span></div>${r.downloadUrl?`<div class="actions"><button class="btn primary" onclick="doInstall('${a(r.repo)}','${a(r.skillName)}',this)">安装</button></div>`:''}</div>`).join('');
}

async function doInstall(repo,name,btn){
  btn.textContent='安装中...';btn.disabled=true;
  const res=await API('install',{repo,name});
  if(res.ok){btn.textContent='✅';btn.className='btn';}
  else{btn.textContent='❌';btn.className='btn danger';setTimeout(()=>{btn.textContent='安装';btn.className='btn primary';btn.disabled=false},2000);}
}

async function loadMine(){
  const l=document.getElementById('mine-list');
  l.innerHTML='<div id="loading">加载中...</div>';
  const res=await API('list');
  if(!res.ok||!res.data.length){l.innerHTML='<div class="empty"><div class="big">📭</div><p>还没有安装 Skill<br>去「发现」搜索并安装</p></div>';return;}
  l.innerHTML=res.data.map(s=>`<div class="card"><div class="name">${s.runAs==='subagent'?'🧬':'📋'} ${s(s.name)}</div><div class="desc">${s(s.description||'')}</div><div class="meta"><span>${s(s.filePath)}</span></div><div class="actions"><button class="btn" onclick="viewDiff('${a(s.name)}')">对比远程</button><button class="btn warn" onclick="updateOne('${a(s.name)}')">更新</button><button class="btn danger" onclick="removeOne('${a(s.name)}')">删除</button></div></div>`).join('');
}

async function removeOne(name){if(!confirm('确定删除 '+name+'？'))return;await API('remove',{name});loadMine();}

async function viewDiff(name){
  curSkill=name;
  const m=document.getElementById('diff-modal'),b=document.getElementById('diff-body'),t=document.getElementById('diff-title'),u=document.getElementById('diff-update-btn');
  t.textContent='📄 '+name+' — 本地 vs 远程';b.innerHTML='加载中...';u.style.display='none';m.classList.add('show');
  const res=await API('diff',{name});
  if(!res.ok){b.innerHTML=res.error;return;}
  if(res.data.same){b.innerHTML='✅ 已是最新版本';return;}
  b.innerHTML=res.data.lines.map(l=>l.op==='add'?`<span class="diff-add">+ ${s(l.text)}</span>`:l.op==='del'?`<span class="diff-del">- ${s(l.text)}</span>`:l.op==='mod'?`<span class="diff-mod">~ ${s(l.text)}</span>`:`<span class="diff-same">  ${s(l.text)}</span>`).join('\n');
  u.style.display='inline-block';
}

function closeDiff(){document.getElementById('diff-modal').classList.remove('show');curSkill=null;}
async function doUpdateFromDiff(){if(!curSkill)return;const btn=document.getElementById('diff-update-btn');btn.textContent='更新中...';btn.disabled=true;const res=await API('update',{name:curSkill});if(res.ok){closeDiff();loadMine();}else{btn.textContent='❌';setTimeout(()=>{btn.textContent='确认更新';btn.disabled=false},2000);}}
async function updateOne(name){curSkill=name;await viewDiff(name);}

async function loadQuality(){
  const el=document.getElementById('quality-content');
  el.innerHTML='<div id="loading">分析中...</div>';
  const res=await API('doctor');
  if(!res.ok||!res.data||res.data.total===0){el.innerHTML='<div class="empty"><p>📭 没有 Skills</p></div>';return;}
  const d=res.data;
  let html=`<p style="color:#8b949e;margin-bottom:16px">${d.total} 个 Skills | ${d.scores.filter(s=>s.grade==='A').length} A · ${d.scores.filter(s=>s.grade==='B').length} B</p>`;
  for(const s of d.scores){
    const color=s.grade==='A'?'#238636':s.grade==='B'?'#58a6ff':s.grade==='C'?'#d29922':'#f85149';
    html+=`<div class="card"><div class="name">${s(s.name)}</div><div class="score-bar" style="margin:8px 0"><span class="grade grade-${s.grade.toLowerCase()}">${s.grade}</span><div class="bar"><div style="width:${s.score}%;background:${color}"></div></div><span style="font-size:12px;color:#8b949e;width:36px;text-align:right">${s.score}</span></div><div style="display:flex;flex-wrap:wrap;gap:4px 16px;font-size:11px;color:#484f58;margin-top:6px">${s.breakdown.map(b=>`<span>${b.category}: ${b.points}/${b.max}</span>`).join('')}</div></div>`;
  }
  el.innerHTML=html;
}

async function loadEnv(){
  const el=document.getElementById('env-content');
  el.innerHTML='<div id="loading">检测中...</div>';
  const res=await API('env');
  if(!res.ok){el.innerHTML=`<div class="empty"><p>${res.error}</p></div>`;return;}
  el.innerHTML='<div class="env-grid">'+res.data.map(c=>`<div class="env-item"><div class="icon">${c.status==='ok'?'✅':c.status==='warn'?'⚠️':'❌'}</div><div><div class="label">${c.label}</div><div class="val">${c.detail}</div></div></div>`).join('')+'</div>';
}

function s(x){return(x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
function a(x){return(x||'').replace(/'/g,'\\x27').replace(/"/g,'&quot;');}
function ta(iso){if(!iso)return'';const d=(Date.now()-new Date(iso).getTime())/(86400000);if(d<1)return'今天';if(d<7)return Math.floor(d)+'天前';if(d<30)return Math.floor(d/7)+'周前';if(d<365)return Math.floor(d/30)+'月前';return Math.floor(d/365)+'年前';}
</script>
</body>
</html>
